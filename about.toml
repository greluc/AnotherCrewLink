# cargo-about: the third-party attribution file GPL distribution wants.
#
# Distributing a GPL binary means distributing the licence texts of everything linked into
# it. The list is 283 crates and changes with every dependency update, so it is generated
# rather than maintained — a hand-written NOTICE file is wrong the first time anything
# moves.
#
# Generate with:
#
#     cargo about generate about.hbs -o THIRD-PARTY.html
#
# The accepted list mirrors deny.toml's. Anything cargo-deny lets in has to have its text
# reproduced here, and anything it refuses never reaches this file.
accepted = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "GPL-3.0-or-later",
    "ISC",
    "MIT",
    "MIT-0",
    "MPL-2.0",
    "OFL-1.1",
    "Ubuntu-font-1.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]

# The one shipping target. This listed three until 2026-08-25: `i686-pc-windows-msvc` was
# already stale -- it lost its reason when the injection path went and rust-toolchain.toml
# dropped it on 2026-08-24 -- and `x86_64-unknown-linux-gnu` went with the client's Linux
# support. Attribution for a target nothing is built for describes a binary nobody has.
targets = ["x86_64-pc-windows-msvc"]

# Build-time-only crates are not distributed, so their licences are not distributed
# either.
ignore-build-dependencies = true
ignore-dev-dependencies = true
