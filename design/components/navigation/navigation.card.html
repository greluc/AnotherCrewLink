<style>body{margin:0;background:var(--surface-app);color:var(--text-body);font-family:var(--font-ui)}.wrap{display:flex;flex-wrap:wrap;align-items:center;gap:16px;padding:16px}.lbl{font-size:11px;color:var(--text-quiet)}.col{display:flex;flex-direction:column;gap:6px;align-items:flex-start}</style>
<div id="root"></div>
<script type="text/babel">
const { TitleBar, LobbyTable, Button } = window.ACL_9b5df9;
const rows = [
  { id:1, Title:'chill euro lobby', Host:'Red', Players:'7/15', Mods:'None', Language:'English', Status:'Lobby 00:42' },
  { id:2, Title:'ranked pubs', Host:'Lime', Players:'15/15', Mods:'None', Language:'English', Status:'In game 04:18' },
];
ReactDOM.createRoot(document.getElementById('root')).render(
  <div>
    <div style={{width:400,border:'1px solid var(--border-hairline)'}}><TitleBar version="1.0.6"/></div>
    <div style={{padding:16}}>
      <LobbyTable columns={['Title','Host','Players','Mods','Language','Status']} rows={rows}
        renderAction={(r)=> <Button variant="contained" color="secondary" disabled={r.Status.startsWith('In game')}>Show code</Button>} />
    </div>
  </div>
);
</script>
