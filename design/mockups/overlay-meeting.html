<script type="text/babel">
let root;
ACLMockup.mount({
  name: 'Overlay · meeting',
  note: 'A separate layer over the discussion tablet. The glow is 0 0 h/100 h/100 in the player\u2019s crew colour and fades in over 400ms — derived from the game height, because a fixed blur swamps the tablet at 1080p. Nothing else is drawn.',
  width: 880, height: 495, minWidth: 480, minHeight: 300,
  presets: [{ label: '854×579 (old hud)', w: 854, h: 579 }, { label: '880×495', w: 880, h: 495 }, { label: '1280×720', w: 1280, h: 720 }],
  annotations: () => [],
  render: (frame, size) => {
    root = root || ReactDOM.createRoot(frame);
    root.render(
      <div style={{ position: 'absolute', inset: 0, background: 'radial-gradient(120% 100% at 30% 0%,#2b3b4e,#101418 70%)' }}>
        <div style={{ position: 'absolute', left: '50%', top: '50%', transform: 'translate(-50%,-50%)', width: '64%', height: '76%', border: '1px dashed rgba(255,255,255,.18)', borderRadius: 18, display: 'grid', placeItems: 'start center', paddingTop: 6, fontSize: 11, fontFamily: 'var(--font-mono)', color: 'rgba(255,255,255,.3)' }}>the game's own discussion tablet</div>
        <MeetingOverlay height={size.height} />
      </div>
    );
  },
});
</script>
