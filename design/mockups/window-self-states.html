<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script>window.ACL_ASSETS='../assets'</script>
<script src="../_ds_bundle.js"></script>
<style>@keyframes acl-spin{to{transform:rotate(360deg)}}::-webkit-scrollbar{width:8px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:var(--acl-scroll-thumb);border-radius:5px}::-webkit-scrollbar-thumb:hover{background:var(--acl-scroll-thumb-hover)}</style>
<script src="mockup-frame.js"></script>
<script type="text/babel" src="../ui_kits/client/VoiceScreen.jsx"></script>
<script type="text/babel">
const { TitleBar } = window.ACL_9b5df9;
const STATES = [
  { label: 'speaking', muted: false, deafened: false, talking: true },
  { label: 'muted', muted: true, deafened: false, talking: false },
  { label: 'deafened', muted: false, deafened: true, talking: false },
];
let root;
ACLMockup.mount({
  name: 'Window · your own states',
  note: 'Mute and deafen are mutually exclusive: setting one clears the other. Your own crewmate is larger than the roster and sits above it, because this is where you check them.',
  width: 900, height: 340, minWidth: 420, minHeight: 260, resizable: false,
  annotations: () => [],
  render: (frame) => {
    root = root || ReactDOM.createRoot(frame);
    root.render(
      <div style={{ display: 'flex', gap: 12, padding: 12, height: '100%', background: '#141218' }}>
        {STATES.map((s) => (
          <div key={s.label} style={{ flex: 1, display: 'flex', flexDirection: 'column', gap: 6, minWidth: 0 }}>
            <div style={{ fontSize: 11, fontFamily: 'var(--font-mono)', color: 'var(--text-quiet)' }}>{s.label}</div>
            <div style={{ flex: 1, background: 'var(--surface-app)', overflow: 'hidden', minHeight: 0 }}>
              <TitleBar version="1.0.6" />
              <div style={{ height: 'calc(100% - 24px)' }}>
                <VoiceScreen muted={s.muted} deafened={s.deafened} talking={s.talking} />
              </div>
            </div>
          </div>
        ))}
      </div>
    );
  },
});
</script>
