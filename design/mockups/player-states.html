<!-- @dsCard group="Client mockups" viewport="820x560" name="Player states" subtitle="Every state a crewmate must render, and what each one means in words" -->
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script>window.ACL_ASSETS='../assets'</script>
<script src="../_ds_bundle.js"></script>
<style>@keyframes acl-spin{to{transform:rotate(360deg)}}::-webkit-scrollbar{width:8px}::-webkit-scrollbar-thumb{background:var(--acl-scroll-thumb);border-radius:5px}</style>
<script src="mockup-frame.js"></script>

<script type="text/babel">
const { Crewmate, StatusBadge } = window.ACL_9b5df9;
const ROWS = [
  { label: 'connected, silent', desc: 'nothing is drawn — an indicator that is always on is one nobody reads', p: {} },
  { label: 'talking', desc: 'a green ring outside the body, never a fill', p: { talking: true } },
  { label: 'muted', desc: 'mic_off on #ea3c2a over #690a00', badge: 'muted' },
  { label: 'deafened', desc: 'volume_off — you cannot hear anybody and nobody can hear you', badge: 'deafened' },
  { label: 'connected, no audio', desc: 'link_off on #e67e22; the Rust ring is #dcb450', badge: 'novoice', p: { link: 'novoice' } },
  { label: 'disconnected', desc: 'wifi_off; the Rust ring is #d25a5a', badge: 'disconnected', p: { link: 'disconnected' } },
  { label: 'bugged', desc: 'red error badge — beats every other state', badge: 'bugged' },
  { label: 'dead', desc: 'the whole avatar at 35%, still recognisable: knowing who is dead is the point', p: { alive: false } },
  { label: 'impostor on the radio', desc: 'radio.svg over the lower right', p: { usingRadio: true, talking: true } },
];
let root;
ACLMockup.mount({
  name: 'Player states',
  note: 'Precedence, highest first: bugged, disconnected, no audio, deafened, muted. Every one of these must also be available as words on hover — egui has no title attribute to inherit.',
  width: 800, height: 540, minWidth: 460, minHeight: 300, resizable: false,
  annotations: () => [],
  render: (frame) => {
    root = root || ReactDOM.createRoot(frame);
    root.render(
      <div style={{ padding: 16, display: 'grid', gap: 6, background: 'var(--surface-app)', height: '100%', overflow: 'auto' }}>
        {ROWS.map((r) => (
          <div key={r.label} style={{ display: 'grid', gridTemplateColumns: '64px 190px 1fr', alignItems: 'center', gap: 12, borderTop: '1px solid var(--border-hairline)', paddingTop: 6 }}>
            <div style={{ position: 'relative', width: 52, height: 52 }}>
              <Crewmate size={52} assetBase="../assets" color="var(--crew-red)" shadow="var(--crew-red-shadow)" hat="pk01_Astronaut.png" {...(r.p || {})} />
              {r.badge && <StatusBadge state={r.badge} style={{ position: 'absolute', left: '50%', top: '50%', transform: 'translate(-50%,-50%)' }} />}
            </div>
            <span style={{ fontSize: 14 }}>{r.label}</span>
            <span style={{ fontSize: 12, color: 'var(--text-quiet)', lineHeight: 1.5 }}>{r.desc}</span>
          </div>
        ))}
      </div>
    );
  },
});
</script>
