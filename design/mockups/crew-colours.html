<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script>window.ACL_ASSETS='../assets'</script>
<script src="../_ds_bundle.js"></script>
<style>@keyframes acl-spin{to{transform:rotate(360deg)}}::-webkit-scrollbar{width:8px}::-webkit-scrollbar-thumb{background:var(--acl-scroll-thumb);border-radius:5px}</style>
<script src="mockup-frame.js"></script>

<script type="text/babel">
const { Crewmate } = window.ACL_9b5df9;
const CREW = ['red','blue','green','pink','orange','yellow','black','white','purple','brown','cyan','lime'];
let root;
ACLMockup.mount({
  name: 'Crew colours',
  note: 'The game\u2019s twelve pairs, in colour-id order — the order must not change. Using the body colour for the shadow gives a flat sticker. An unknown id is grey (#8a8a8a), never absent.',
  width: 800, height: 320, minWidth: 420, minHeight: 220, resizable: false,
  annotations: () => [],
  render: (frame) => {
    root = root || ReactDOM.createRoot(frame);
    root.render(
      <div style={{ padding: 16, background: 'var(--surface-app)', height: '100%', overflow: 'auto' }}>
        {[true, false].map((alive) => (
          <div key={String(alive)} style={{ marginBottom: 14 }}>
            <div style={{ fontSize: 11, fontFamily: 'var(--font-mono)', color: 'var(--text-quiet)', marginBottom: 6 }}>{alive ? 'alive' : 'dead — 35%, cosmetics hidden'}</div>
            <div style={{ display: 'flex', gap: 8, flexWrap: 'wrap' }}>
              {CREW.map((c, i) => (
                <div key={c} style={{ textAlign: 'center', width: 56 }}>
                  <Crewmate size={52} assetBase="../assets" alive={alive} hat={alive ? 'pk04_MinerCap.png' : undefined}
                    color={'var(--crew-' + c + ')'} shadow={'var(--crew-' + c + '-shadow)'} />
                  <div style={{ fontSize: 10, fontFamily: 'var(--font-mono)', color: 'var(--text-quiet)', marginTop: 2 }}>{i} {c}</div>
                </div>
              ))}
            </div>
          </div>
        ))}
      </div>
    );
  },
});
</script>
