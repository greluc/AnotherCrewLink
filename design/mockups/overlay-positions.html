<!-- @dsCard group="Client mockups" viewport="820x520" name="Overlay · positions" subtitle="Drawn over the running game. Four positions, four different veils" -->
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script>window.ACL_ASSETS='../assets'</script>
<script src="../_ds_bundle.js"></script>
<style>@keyframes acl-spin{to{transform:rotate(360deg)}}::-webkit-scrollbar{width:8px}::-webkit-scrollbar-thumb{background:var(--acl-scroll-thumb);border-radius:5px}</style>
<script src="mockup-frame.js"></script>
<script type="text/babel" src="../ui_kits/client/GameOverlay.jsx"></script>
<script type="text/babel">
let root;
let position = 'top';
const view = ACLMockup.mount({
  name: 'Overlay · positions',
  note: 'Transparent by definition and never interactive — the veil is the only background. top rgba(0,0,0,.5) · bottom left .35 · left/right the #25232ac0 capsule with one rounded end. The gradient stands in for the game; it is not part of the design.',
  width: 800, height: 450, minWidth: 400, minHeight: 260,
  presets: [{ label: '640×360', w: 640, h: 360 }, { label: '800×450', w: 800, h: 450 }, { label: '1280×720', w: 1280, h: 720 }],
  annotations: () => [{ sel: '[data-mk="capsule"] > div', edge: 'box', label: position }],
  render: (frame) => {
    root = root || ReactDOM.createRoot(frame);
    root.render(
      <div style={{ position: 'absolute', inset: 0, background: 'radial-gradient(120% 100% at 30% 0%,#2b3b4e,#101418 70%)' }}>
        <div data-mk="capsule"><GameOverlay position={position} /></div>
        <span style={{ position: 'absolute', bottom: 8, right: 10, fontSize: 11, color: 'rgba(255,255,255,.35)', fontFamily: 'var(--font-mono)' }}>the game, standing in for a screenshot</span>
      </div>
    );
  },
});
addEventListener('load', () => {
  const bar = document.querySelector('.mk-bar');
  if (!bar) return;
  const row = document.createElement('div');
  row.className = 'mk-row';
  ['top', 'bottom_left', 'left', 'right'].forEach((p) => {
    const b = document.createElement('button');
    b.className = 'mk-btn';
    b.textContent = p.replace('_', ' ');
    b.dataset.on = p === position ? '1' : '0';
    b.onclick = () => {
      position = p;
      row.querySelectorAll('.mk-btn').forEach((x) => { x.dataset.on = x.textContent === p.replace('_', ' ') ? '1' : '0'; });
      view.repaint();
    };
    row.appendChild(b);
  });
  bar.appendChild(row);
});
</script>
