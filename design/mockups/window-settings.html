<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script>window.ACL_ASSETS='../assets'</script>

<style>@keyframes acl-spin{to{transform:rotate(360deg)}}::-webkit-scrollbar{width:8px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:var(--acl-scroll-thumb);border-radius:5px}::-webkit-scrollbar-thumb:hover{background:var(--acl-scroll-thumb-hover)}</style>

<script type="text/babel" src="../ui_kits/client/VoiceScreen.jsx"></script>
<script type="text/babel" src="../ui_kits/client/SettingsScreen.jsx"></script>
<script type="text/babel">
const { TitleBar } = window.ACL_9b5df9;
let root;
const view = ACLMockup.mount({
  name: 'Window · settings',
  note: 'Not a route: a sheet at z-index 99 below the title bar, sliding in from the left over the roster. Eight sections in source order, one scroll column, 56px of bottom padding under a pinned alert.',
  width: 400, height: 560, minWidth: 250, minHeight: 320,
  presets: [{ label: '250 min', w: 250 }, { label: '400', w: 400 }, { label: '520', w: 520 }],
  annotations: () => [
    { sel: '[data-mk="sheet"] > div', edge: 'height', side: 'inside', label: '40 header' },
  ],
  render: (frame, size) => {
    root = root || ReactDOM.createRoot(frame);
    root.render(
      <>
        <TitleBar version="1.0.6" />
        <div style={{ height: size.height - 24 }}><VoiceScreen talking={false} /></div>
        <div data-mk="sheet"><SettingsScreen open onClose={() => {}} /></div>
      </>
    );
  },
});
// Section jumps: the panel is one long scroll, and each section is worth verifying on its own.
addEventListener('load', () => {
  const bar = document.querySelector('.mk-bar');
  if (!bar) return;
  const row = document.createElement('div');
  row.className = 'mk-row';
  ['Lobby Settings', 'Audio', 'Keyboard Shortcuts', 'Overlay', 'Advanced', 'Troubleshooting'].forEach((name) => {
    const b = document.createElement('button');
    b.className = 'mk-btn';
    b.textContent = name.split(' ')[0];
    b.title = name;
    b.onclick = () => {
      const scroller = document.querySelector('[data-mk="sheet"] div[style*="overflow-y"]');
      const target = [...document.querySelectorAll('[data-mk="sheet"] h2')].find((h) => h.textContent === name);
      if (scroller && target) scroller.scrollTop += target.getBoundingClientRect().top - scroller.getBoundingClientRect().top - 8;
    };
    row.appendChild(b);
  });
  bar.appendChild(row);
});
</script>
