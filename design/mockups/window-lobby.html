<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script>window.ACL_ASSETS='../assets'</script>
<script src="../_ds_bundle.js"></script>
<style>@keyframes acl-spin{to{transform:rotate(360deg)}}::-webkit-scrollbar{width:8px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:var(--acl-scroll-thumb);border-radius:5px}::-webkit-scrollbar-thumb:hover{background:var(--acl-scroll-thumb-hover)}</style>
<script src="mockup-frame.js"></script>
<script type="text/babel" src="../ui_kits/client/VoiceScreen.jsx"></script>
<script type="text/babel">
const { TitleBar } = window.ACL_9b5df9;
let root;
const view = ACLMockup.mount({
  name: 'Window · in a lobby',
  note: 'The reflow view. Roster cells are 32% wide, min 60, max 120, so the count per row changes with the window. Verify at 250 (three per row) as well as at 400.',
  width: 400, height: 520, minWidth: 250, minHeight: 260,
  presets: [{ label: '250 min', w: 250 }, { label: '400', w: 400 }, { label: '520', w: 520 }, { label: '760', w: 760 }],
  annotations: () => [
    { sel: '[data-mk="titlebar"]', edge: 'height', side: 'inside', label: '24' },
    { sel: '[data-mk="code"]', edge: 'box', label: 'lobby code 28px mono' },
    { sel: '[data-mk="roster"] > div', edge: 'width', side: 'below', label: '32% · min 60 · max 120' },
  ],
  render: (frame, size) => {
    root = root || ReactDOM.createRoot(frame);
    root.render(
      <>
        <div data-mk="titlebar"><TitleBar version="1.0.6" /></div>
        <div style={{ height: size.height - 24 }}>
          <VoiceScreen muted={false} deafened={false} talking />
        </div>
      </>
    );
    // The roster and the code chip belong to VoiceScreen; tag them for the callouts
    // rather than duplicating their markup here.
    requestAnimationFrame(() => {
      const wrap = frame.querySelector('div[style*="flex-wrap"]');
      if (wrap) wrap.dataset.mk = 'roster';
      const chip = frame.querySelector('span[style*="var(--font-mono)"]');
      if (chip) chip.dataset.mk = 'code';
    });
  },
});
</script>
