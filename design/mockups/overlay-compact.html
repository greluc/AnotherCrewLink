<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script>window.ACL_ASSETS='../assets'</script>
<script src="../_ds_bundle.js"></script>
<style>@keyframes acl-spin{to{transform:rotate(360deg)}}::-webkit-scrollbar{width:8px}::-webkit-scrollbar-thumb{background:var(--acl-scroll-thumb);border-radius:5px}</style>
<script src="mockup-frame.js"></script>
<script type="text/babel" src="../ui_kits/client/GameOverlay.jsx"></script>
<script type="text/babel">
let root;
ACLMockup.mount({
  name: 'Overlay · compact',
  note: 'A capsule with one rounded end (radius 25), 9vh wide, and only the players who are speaking. When nobody speaks the overlay disappears entirely — that is the feature, not a bug to fix.',
  width: 800, height: 400, minWidth: 400, minHeight: 240,
  presets: [{ label: '640×360', w: 640, h: 360 }, { label: '1280×720', w: 1280, h: 720 }],
  annotations: () => [{ sel: '[data-mk="l"] > div > div', edge: 'box', label: 'talking only' }],
  render: (frame) => {
    root = root || ReactDOM.createRoot(frame);
    root.render(
      <div style={{ position: 'absolute', inset: 0, background: 'radial-gradient(120% 100% at 30% 0%,#2b3b4e,#101418 70%)' }}>
        <div data-mk="l"><GameOverlay position="left" compact /></div>
        <div><GameOverlay position="right" compact /></div>
      </div>
    );
  },
});
</script>
