<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<!-- @template name="Client window" description="The AnotherCrewLink client window: title bar, your own crewmate, the lobby code and the roster." -->
<helmet>
<script src="./ds-base.js"></script>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Varela+Round&family=Source+Code+Pro:wght@500&display=swap">
<style>body{margin:0;background:#141218}::-webkit-scrollbar{width:8px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:rgba(255,255,255,.2);border-radius:5px}</style>
</helmet>
<div style="min-height:100vh;display:grid;place-items:center;padding:32px;font-family:'Varela Round',system-ui,sans-serif;color:#fff">
<div style="width:400px;height:520px;position:relative;overflow:hidden;background:#25232a;box-shadow:0 18px 40px rgba(0,0,0,.55)">
<div style="position:relative;width:100%;height:24px;background:#1d1a23">
<span style="display:block;width:100%;text-align:center;height:24px;line-height:24px;color:#ba68c8;font-size:14px">AnotherCrewLink v1.0.6</span>
<span style="position:absolute;top:2px;left:4px;display:flex;gap:2px;color:#777;font-family:'Material Symbols Rounded';font-size:20px"><span class="acl-icon">settings</span><span class="acl-icon">refresh</span></span>
<span style="position:absolute;top:2px;right:4px;color:#777;font-family:'Material Symbols Rounded';font-size:20px" class="acl-icon">close</span>
</div>
<div style="height:calc(100% - 24px);display:flex;flex-direction:column;box-sizing:border-box">
<div style="display:flex;align-items:center;padding:8px 0">
<div style="width:100px;padding-left:8px">
<x-import component-from-global-scope="ACL_9b5df9.Crewmate" size="{{ ownSize }}" asset-base="../../assets" hat="pk01_Astronaut.png" color="var(--crew-purple)" shadow="var(--crew-purple-shadow)" talking="{{ talking }}" hint-size="80px,80px"></x-import>
</div>
<div style="flex:1;min-width:0;display:flex;flex-direction:column;align-items:center">
<span style="display:block;text-align:center;font-size:20px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%">Greluc</span>
<x-import component-from-global-scope="ACL_9b5df9.LobbyCode" code="{{ lobbyCode }}" background="var(--crew-purple-shadow)" hint-size="120px,42px"></x-import>
</div>
<div style="padding-left:5px;padding-top:26px;display:grid;gap:2px;color:#fff;font-family:'Material Symbols Rounded';font-size:20px">
<span class="acl-icon">mic</span>
<span class="acl-icon">volume_up</span>
</div>
</div>
<hr style="width:100%;border:0;border-top:1px solid rgba(255,255,255,.12);margin:8px 0">
<div style="flex:1 1 auto;min-height:0;overflow-y:auto;display:flex;flex-wrap:wrap;justify-content:center;align-content:flex-start;gap:0;width:100%">
<div style="width:32%;min-width:60px;max-width:120px;padding:8px;box-sizing:border-box"><x-import component-from-global-scope="ACL_9b5df9.PlayerSlot" asset-base="../../assets" hat="pk04_MinerCap.png" name="Lime" color="var(--crew-lime)" shadow="var(--crew-lime-shadow)" size="{{ rosterSize }}" slot="{{ rosterSlot }}" talking="{{ true }}" hint-size="104px,104px"></x-import></div>
<div style="width:32%;min-width:60px;max-width:120px;padding:8px;box-sizing:border-box"><x-import component-from-global-scope="ACL_9b5df9.PlayerSlot" asset-base="../../assets" name="Blue" color="var(--crew-blue)" shadow="var(--crew-blue-shadow)" size="{{ rosterSize }}" slot="{{ rosterSlot }}" hint-size="104px,104px"></x-import></div>
<div style="width:32%;min-width:60px;max-width:120px;padding:8px;box-sizing:border-box"><x-import component-from-global-scope="ACL_9b5df9.PlayerSlot" asset-base="../../assets" hat="flowerCrownHat.png" name="Pink" color="var(--crew-pink)" shadow="var(--crew-pink-shadow)" size="{{ rosterSize }}" slot="{{ rosterSlot }}" badge="novoice" hint-size="104px,104px"></x-import></div>
<div style="width:32%;min-width:60px;max-width:120px;padding:8px;box-sizing:border-box"><x-import component-from-global-scope="ACL_9b5df9.PlayerSlot" asset-base="../../assets" hat="pk02_Crown.png" name="Yellow" color="var(--crew-yellow)" shadow="var(--crew-yellow-shadow)" size="{{ rosterSize }}" slot="{{ rosterSlot }}" hint-size="104px,104px"></x-import></div>
<div style="width:32%;min-width:60px;max-width:120px;padding:8px;box-sizing:border-box"><x-import component-from-global-scope="ACL_9b5df9.PlayerSlot" asset-base="../../assets" name="Black" color="var(--crew-black)" shadow="var(--crew-black-shadow)" size="{{ rosterSize }}" slot="{{ rosterSlot }}" alive="{{ false }}" hint-size="104px,104px"></x-import></div>
<div style="width:32%;min-width:60px;max-width:120px;padding:8px;box-sizing:border-box"><x-import component-from-global-scope="ACL_9b5df9.PlayerSlot" asset-base="../../assets" hat="pk03_Fedora.png" name="Orange" color="var(--crew-orange)" shadow="var(--crew-orange-shadow)" size="{{ rosterSize }}" slot="{{ rosterSlot }}" badge="muted" hint-size="104px,104px"></x-import></div>
</div>
</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:464,&quot;height&quot;:584},&quot;lobbyCode&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;XKJDPQ&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;hideCode&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Streaming&quot;},&quot;animateTalking&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;}}">
class Component extends DCLogic {
  state = { talking: true };
  componentDidMount() {
    this.timer = setInterval(() => this.setState((s) => ({ talking: !s.talking })), 2200);
  }
  componentWillUnmount() { clearInterval(this.timer); }
  renderVals() {
    return {
      // Numbers, not strings: an attribute like size="80" reaches React as a string and
      // a string is not a CSS length it will unit-ise, so the avatar collapses.
      ownSize: 80,
      rosterSize: 78,
      rosterSlot: 120,
      lobbyCode: this.props.hideCode ? 'LOBBY' : (this.props.lobbyCode ?? 'XKJDPQ'),
      talking: this.props.animateTalking === false ? false : this.state.talking,
    };
  }
}
</script>
</body>
</html>
