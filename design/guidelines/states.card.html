<!-- @dsCard group="Motion" viewport="700x180" name="Interaction states" subtitle="Hover recolours a border; nothing moves or scales" -->
<meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;background:var(--surface-app);color:var(--text-body);font-family:var(--font-ui)}.p{padding:14px}.row{display:flex;gap:10px;flex-wrap:wrap}.sw{width:96px}.chip{height:52px;border-radius:5px;border:1px solid rgba(255,255,255,.08)}.n{font-size:11px;margin-top:5px;color:#fff}.v{font-size:10px;color:var(--text-quiet);font-family:var(--font-mono)}</style><div class="p" style="display:grid;grid-template-columns:repeat(4,1fr);gap:14px;font-size:12px">
<div><div style="height:40px;border:2px solid #fff;border-radius:10px;display:grid;place-items:center">rest</div><div class="v">border #fff</div></div>
<div><div style="height:40px;border:2px solid var(--accent-action);border-radius:10px;display:grid;place-items:center">hover</div><div class="v">border #00ff00</div></div>
<div><div style="height:40px;border:2px solid #fff;border-radius:10px;display:grid;place-items:center;opacity:.38">disabled</div><div class="v">opacity .38</div></div>
<div><div style="height:40px;border-radius:4px;display:grid;place-items:center;background:rgba(186,104,200,.12);color:var(--accent-primary)">MUI hover</div><div class="v">12% tint wash</div></div>
<div style="grid-column:1/-1" class="v">Selected toggle: border turns green. Dead player: whole avatar to 35% opacity. Talking: a green ring grows outside the body, never a fill.</div>
</div>
