<!-- @dsCard group="Colors" viewport="700x160" name="Overlay veils" subtitle="Drawn over the running game, so every value is transparent" -->
<meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;background:var(--surface-app);color:var(--text-body);font-family:var(--font-ui)}.p{padding:14px}.row{display:flex;gap:10px;flex-wrap:wrap}.sw{width:96px}.chip{height:52px;border-radius:5px;border:1px solid rgba(255,255,255,.08)}.n{font-size:11px;margin-top:5px;color:#fff}.v{font-size:10px;color:var(--text-quiet);font-family:var(--font-mono)}</style><div class="p" style="background:linear-gradient(90deg,#3b2a52,#1b3a2e)">
<div class="row">
<div class="sw"><div class="chip" style="height:52px;background:rgba(0,0,0,.85)"></div><div class="n">Menu .85</div><div class="v">--acl-veil-strong</div></div><div class="sw"><div class="chip" style="height:52px;background:rgba(0,0,0,.5)"></div><div class="n">In game .5</div><div class="v">--acl-veil-mid</div></div><div class="sw"><div class="chip" style="height:52px;background:rgba(0,0,0,.35)"></div><div class="n">Bottom .35</div><div class="v">--acl-veil-soft</div></div><div class="sw"><div class="chip" style="height:52px;background:#25232ac0"></div><div class="n">Capsule</div><div class="v">--acl-veil-window</div></div><div class="sw"><div class="chip" style="height:52px;background:#23272adb"></div><div class="n">Tooltip</div><div class="v">--acl-bg-tooltip</div></div>
</div></div>
