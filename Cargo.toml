# The Rust workspace for the 2.x client. The Electron app in `src/` is what ships today
# and is untouched by anything here; the two live side by side until `P8`.
#
# Phase 1 of `docs/rust-port/04-implementation-plan.md`. The crates listed there but not
# present yet arrive in their own phases — `acl-game` in P2, `acl-audio` in P3, and so on.

[workspace]
resolver = "3"
members = ["crates/acl-types", "crates/acl-audio", "crates/acl-game", "crates/acl-net", "crates/acl-i18n", "crates/acl-ipc", "experiments/overlay-probe", "experiments/apm-probe", "experiments/webrtc-probe"]

# CI checks the server repository out into `server/` to run the conformance test against
# it. Without this, cargo folds that crate into this workspace and refuses to build it —
# "current package believes it's in a workspace when it's not".
exclude = ["server"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.98.0"
license = "GPL-3.0-or-later"
repository = "https://github.com/greluc/AnotherCrewLink"

[workspace.lints.rust]
# The reader and the injection path are the reason this is `deny` rather than `warn`: an
# unsafe block inside an unsafe fn is the one that reads as checked and is not.
unsafe_op_in_unsafe_fn = "deny"
missing_docs = "warn"
unreachable_pub = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
# Every one of these turns a wrong number into a wrong answer somewhere else, and this
# codebase is mostly numbers: offsets, coordinates, gains.
cast_possible_truncation = "warn"
cast_precision_loss = "warn"
cast_sign_loss = "warn"
# Panicking is a crash in a voice client that is meant to survive a bad frame.
unwrap_used = "warn"
expect_used = "warn"
indexing_slicing = "warn"

[workspace.dependencies]
# The version is carried so this is not a wildcard dependency: deny.toml keeps
# `allow-wildcard-paths = false`, which is the setting that would otherwise let an
# unversioned path dependency through unnoticed.
acl-types = { path = "crates/acl-types", version = "0.0.0" }
acl-audio = { path = "crates/acl-audio", version = "0.0.0" }
kurbo = "0.13.1"
serde = { version = "1.0", features = ["derive"] }
# platform-verifier reads the operating system's certificate store, which is what
# Chromium supplied for free and what the WebSocket transport still lacks. The three
# plain GETs this client makes get it now; P4 closes the same gap for the socket.
# Recordings are committed compressed. A frame's regions barely change between frames --
# 99.8% of them are byte-identical to the one before -- so a session gzips by a factor
# of 130. The alternative was a delta format in the recorder: more code, for less.
flate2 = "1.1"
# Pinned exactly, as the plan asks: the codec is the one thing on the wire that both ends
# have to agree about byte for byte, and a patch release that changes a default would be
# audible before it was noticed.
#
# 0.4.0 rather than the plan's =0.3.1. That pin was written before this release existed and
# now points at an unmaintained transitive dependency: 0.3.1 binds libopus through
# `audiopus_sys`, whose last commit is five years old and which carries RUSTSEC-2026-0150 —
# it pins a CMake version that CMake 4.0 refuses, so the build breaks for anyone who has a
# current one. 0.4.0 binds through `opusic-sys` instead.
opus = "=0.4.0"
# The same libopus the `opus` crate is already binding, taken directly for one function it
# does not re-export: `opus_packet_has_lbrr`, which answers whether a packet actually
# carries a redundant copy of its predecessor. Without it a decode-with-FEC call cannot be
# distinguished from concealment -- libopus succeeds either way -- and every measurement
# that separates the two is guesswork. Nothing new enters the build; this is already in the
# graph beneath `opus`, and the version tracks what `=0.4.0` resolves to.
opusic-sys = "=0.7.5"
# Pinned exactly for the same reason as the codec: a resampler that changes its filter
# between patch releases changes what every microphone sounds like, and it would be heard
# before it was noticed. Used through `process_into_buffer` only — see `resample.rs`.
rubato = "=5.0.0"
# Not pinned exactly, unlike the codec and the resampler: this one is behind a trait
# precisely so it can be replaced, and `cubeb` is the documented fallback. See
# `acl-audio::device` for the trigger conditions.
cpal = "0.18"
# The echo canceller, behind `acl-audio::apm`'s trait for the same reason cpal is behind
# `device`'s: the gate was allowed to change the answer without changing the graph, and it
# very nearly did. Pure Rust, BSD-3-Clause, ported from WebRTC M145. Measured against
# libwebrtc's AEC3 on the same echo path at 11.6 dB against 11.3 dB -- no difference --
# so the decision fell to AEC3 arriving as a prebuilt 86 MB blob. See `experiments/`.
sonora = "0.2.0"
# `default-features = false` is not a preference, it is the whole reason this is usable:
# the defaults pull in axum, clap, a second cpal three majors behind the pinned one, and
# `ropus` — a second Opus implementation, in a binary that already carries libopus.
neteq = { version = "0.9.1", default-features = false }
ureq = { version = "3.4", default-features = false, features = ["rustls", "platform-verifier"] }
serde_json = "1.0"
thiserror = "2.0"
tokio = { version = "1.53", features = ["rt", "net", "time", "macros"] }
# webpki roots rather than the platform store, and no proxy resolver: both are
# budgeted as named line items in the plan and are P4's to close.
tokio-tungstenite = { version = "0.30", default-features = false, features = ["connect", "handshake", "rustls-tls-webpki-roots"] }
futures-util = { version = "0.3", default-features = false, features = ["sink"] }
tracing = "0.1"
# Pinned exactly for the reason the codec and the resampler are: this one decides what
# goes on the wire between two clients, and a patch release that changes a default would
# be heard before it was noticed. The maintainer also states that a minor bump may carry
# breaking changes, which is unusual enough to pin against on its own.
webrtc = "=0.20.3"

[profile.release]
# A panic in the elevated helper must not unwind through the FFI boundary into the game's
# process. Aborting is also smaller and faster.
panic = "abort"
lto = "thin"
codegen-units = 1
strip = "debuginfo"
