[package]
name = "acl-game"
description = "Reads Among Us out of process memory: the trait, the scanners, and the platform implementations."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = ["http"]
# The HTTP client, for fetching the offsets bundle. Off in a build that only ever reads a
# cache or the embedded floor -- which is what the parity harness and the fuzzer do.
http = ["dep:ureq"]

[dependencies]
acl-types.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
ureq = { workspace = true, optional = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
	"Win32_Foundation",
	"Win32_System_Diagnostics_ToolHelp",
	"Win32_System_Threading",
	"Win32_System_Memory",
	"Win32_System_ProcessStatus",
	"Win32_System_Diagnostics_Debug",
] }

[target.'cfg(target_os = "linux")'.dependencies]
# process_vm_readv is a safe fn whose lengths derive from the slices passed in, so the
# Linux reader contains no unsafe at all.
nix = { version = "0.30", default-features = false, features = ["uio", "process"] }

[dev-dependencies]
flate2.workspace = true
serde.workspace = true
serde_json.workspace = true

[lints]
workspace = true
