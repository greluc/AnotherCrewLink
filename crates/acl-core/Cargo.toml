[package]
name = "acl-core"
description = "The unelevated half of the client: what it can do, and when it may ask for the other half."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
# For `AmongUsState`, which `link` decodes out of the helper's frames.
#
# It brings the reader itself into the unelevated binary, where it is never called. That
# is dead code rather than a privilege -- reading an elevated game still needs a handle
# this process cannot get -- and the tidier answer, moving the state type into
# `acl-types` where both halves could reach it, is a wide refactor across a green G1
# gate. Worth doing if the reader ever becomes unwanted here; not worth doing for tidiness.
acl-game = { path = "../acl-game", version = "2.0.0-alpha.5", default-features = false }
acl-ipc.workspace = true
# The signalling half. `session` is the driver §4.6 item 3 leaves to this crate.
acl-net = { path = "../acl-net", version = "2.0.0-alpha.5" }
# The peer connections `peers` owns. Same pin as `acl-net`, which is where the reason is.
# The `webrtc` event handler trait is declared with `#[async_trait]`, so implementing one
# needs the same macro. Version matched to `acl-net`, which implements the same trait.
async-trait = "0.1"
tokio = { workspace = true, features = ["sync"] }
webrtc.workspace = true
# `webrtc` re-exports selectively, and the codec types a local track is built from are not
# among them -- the crate's own documentation imports them from `rtc` directly. It is
# already in the tree beneath `webrtc`; this only makes the edge direct, so nothing new
# enters the dependency graph. Pinned to the same version for the same reason `webrtc` is.
rtc = "=0.20.3"
# One type: the byte buffer a media sample carries. Already in the tree beneath `rtc`, so
# naming it here costs nothing and saves a conversion at the only place audio is handed
# over.
bytes = "1"
serde_json.workspace = true
postcard = { version = "1.1.3", default-features = false, features = ["alloc"] }
thiserror.workspace = true
tracing.workspace = true

[target.'cfg(windows)'.dependencies]
# The single-instance lock, and nothing else yet: one window lookup and one named mutex.
# The same 0.61 `acl-game` reads process memory with, so the workspace resolves one copy.
windows-sys = { version = "0.61", features = [
	"Win32_Foundation",
	# ClientToScreen, which maps the game's client origin into screen coordinates. It is
	# declared under GDI rather than under windowing, which is where it would be looked for.
	"Win32_Graphics_Gdi",
	# CreateMutexW takes a SECURITY_ATTRIBUTES pointer, so its declaration is behind this
	# feature even though the pointer passed is always null.
	"Win32_Security",
	"Win32_System_Threading",
	# GetAsyncKeyState, for the push-to-talk poll.
	"Win32_UI_Input_KeyboardAndMouse",
	# SHQueryUserNotificationState, for exclusive-fullscreen detection.
	# SHELLEXECUTEINFOW carries an HKEY, so its declaration is behind the registry
	# feature even though the field is always null here.
	"Win32_System_Registry",
	"Win32_UI_Shell",
	# ShellExecuteExW, which is the only way to ask for elevation: CreateProcess cannot,
	# because elevation goes through the AppInfo service.
	"Win32_UI_WindowsAndMessaging",
	"Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
# One Opus packet, for the loopback test that proves audio crosses. A real packet rather
# than an invented payload: the track is negotiated as Opus, and a packetizer handed
# something else is a packetizer whose behaviour nobody has looked at.
acl-audio.workspace = true
# So `start_game` can check its plan against the real store identifiers rather than against
# copies of them. The module itself does not need the crate -- it takes the four fields a
# platform is described by, because a custom platform has no `Platform` to be.
acl-types.workspace = true
# For `tests/session_conformance.rs`, which drives two sessions against a real server.
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time", "net"] }

# `product_name_still_matches_package_json` reads the Electron manifest, because the
# directory 1.x writes into is `productName` and a rename there is silent here.
serde_json.workspace = true

[lints]
workspace = true
