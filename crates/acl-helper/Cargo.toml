[package]
name = "acl-helper"
description = "The elevated half of the client: it reads the game and tells the core, and does nothing else."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
name = "acl_helper"
path = "src/lib.rs"

[[bin]]
name = "acl-helper"
path = "src/main.rs"

[dependencies]
# `acl-game` without its `http` feature, and that is the point of the feature existing.
# §6 of docs/rust-port/06-security.md requires the elevated process to carry no HTTP
# client; the core fetches the offsets bundle and sends it over the pipe.
acl-game = { path = "../acl-game", version = "2.0.0-alpha.3", default-features = false }
acl-ipc.workspace = true
postcard = { version = "1.1.3", default-features = false, features = ["alloc"] }
# The offsets bundle arrives as the JSON it is on disk, not as postcard: it carries
# `serde_json::Value` fields, and deserialising one needs a self-describing format.
serde_json.workspace = true
thiserror.workspace = true

[target.'cfg(windows)'.dependencies]
# One watchdog: open the core process and wait on it. See `watchdog` in main.rs for why an
# elevated process must not be left waiting for a client that is never coming.
windows-sys = { version = "0.61", features = [
	"Win32_Foundation",
	"Win32_Graphics_Gdi",
	"Win32_Storage_FileSystem",
	"Win32_System_LibraryLoader",
	# The overlay is placed in the coordinates the client measured, and the client is
	# per-monitor aware. A process that is not gets every one of them rewritten.
	"Win32_UI_HiDpi",
	"Win32_UI_WindowsAndMessaging",
	"Win32_System_Threading",
] }

[dev-dependencies]
# `tests/overlay_window.rs` asks the operating system what the window's styles and
# rectangle actually are, rather than trusting that it was asked for the right ones.
# `Win32_UI_HiDpi` so a test can measure in the same coordinates the helper places in --
# without it a test process is DPI-unaware and reads back scaled numbers.
windows-sys = { version = "0.61", features = [
	"Win32_Foundation",
	"Win32_UI_HiDpi",
	"Win32_UI_WindowsAndMessaging",
] }
# For `launch::arguments`, so the test builds the command line the same way the core does
# rather than spelling it out a third time.
acl-core = { path = "../acl-core", version = "2.0.0-alpha.3" }

[lints]
workspace = true

[build-dependencies]
winresource.workspace = true
