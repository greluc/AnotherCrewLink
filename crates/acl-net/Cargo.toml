[package]
name = "acl-net"
description = "Socket.IO signalling for AnotherCrewLink: the wire protocol, the session and the reconnect policy."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
futures-util.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-tungstenite.workspace = true
# P4's transport. Pinned exactly, as §4.6 item 2 asks: the maintainer states a minor bump
# may carry breaking changes, and 0.20 is a sans-IO rewrite rather than the Pion port
# older versions were. It costs 141 crates -- measured, and all four supply-chain gates
# accept them; see `experiments/README.md` experiment 3.
webrtc.workspace = true

[dev-dependencies]
# The `webrtc` event handler trait is declared with `#[async_trait]`, so the loopback
# test's handler needs the same macro.
async-trait = "0.1"
# STUN and TURN message building, for the TURN-over-TCP test's server. Already in the tree
# underneath `webrtc` at this exact version, so it costs no new crate and no new licence;
# naming it here is what lets a test speak the other half of the protocol.
rtc = "=0.20.3"
# The stream splitter, so the test server reads its side of the connection the same way the
# transport reads the other -- a length prefix written by either end fails the test rather
# than being quietly tolerated.
acl-turn-framing.workspace = true
# A `log` implementation for the bulk-transfer test. A shed packet and a failed writer are
# internal to `vendor/webrtc` and reach no API, so the log line is the only place either
# surfaces -- and both are the transport reporting that it has given up.
log.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time", "net", "process"] }

[lints]
workspace = true
