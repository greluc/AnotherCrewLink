[package]
name = "acl-ui"
description = "Phase 6's views, and the decisions behind them that need no window."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
# The palette and the colliders. `acl-types` has no GUI dependency and must not gain one,
# which is why the hex strings are parsed on this side.
acl-types.workspace = true
# Only `views` uses it. Everything else here decides something and is testable without a
# window, which is the split §4.8 asks this crate to keep.
egui = "0.36.1"
# `window_state` is read from and written to `windows.json`, which 1.x also writes.
# The hat artwork is PNG, and the overlay composites it on the CPU -- there is no GPU in
# the helper to hand it to. `png` rather than `image`: both are already in the tree beneath
# `eframe`, so neither costs a crate, and this needs one decoder rather than a format
# registry.
png = "0.18.1"
serde.workspace = true
# The older `window-state.json` is read as a loose document: it predates this client and
# only its two dimensions are required, so it is not deserialised into a type.
serde_json.workspace = true
url.workspace = true

[dev-dependencies]
# `settings_screen` names i18n keys; the catalogue is what says whether they exist. A
# development dependency rather than a real one because the views take their strings from
# the caller -- this crate does not load a locale, it only names keys.
acl-i18n.workspace = true

[lints]
workspace = true
