[package]
name = "acl-client"
description = "The window: §4.8 item 1's shell, and the first thing that assembles the rest."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[[bin]]
# The name the product has had since 1.0, because the installer, the single-instance lock
# and `%APPDATA%\AnotherCrewLink` all key on it.
name = "anothercrewlink"
path = "src/main.rs"

[features]
default = ["http"]
# The hat artwork is fetched over HTTPS. Off in a build that has no network -- the store
# then answers every fetch with a message saying so, and every avatar draws without its
# layers, which is what a failed fetch does anyway.
http = ["dep:ureq"]

[dependencies]
# `acl-core` is the unelevated process §3.2 describes; this crate is the binary that *is*
# it. Separate so that no library in the workspace has to carry a GUI dependency -- in
# particular `acl-helper`, whose tests depend on `acl-core` and have no use for a window.
acl-core = { path = "../acl-core", version = "0.0.0" }
# The relay configuration the mesh is built from, and the connection state it reports. Both
# are `acl-core`'s types; these are the two crates they come from.
acl-net = { path = "../acl-net", version = "0.0.0" }
webrtc.workspace = true
acl-game = { path = "../acl-game", version = "0.0.0" }
acl-ui = { path = "../acl-ui", version = "0.0.0" }
# The 37 locale names and the catalogue the settings screen reads its strings from.
acl-i18n.workspace = true
# The pinned hat collection: the commit the artwork comes from, and the only origin the
# store will fetch from.
acl-types.workspace = true
# The same client the offsets store uses, with the same certificate handling. A second HTTP
# crate would be a second TLS configuration to get right.
ureq = { workspace = true, optional = true }
# The session is async and this window is not, so the runtime lives on a thread of its own.
# `rt` and `time` only: a current-thread runtime driving one socket needs no work-stealing
# scheduler, and the timeout on the poll is the only timer.
tokio = { workspace = true, features = ["rt", "time"] }
# `wgpu`, as §3.3 chose and §4.8 item 6 settled on 2026-08-26. It was `glow` until then,
# because the fallback chain is what the choice turns on and the chain was not built yet:
# `force_fallback_adapter` and adapter selection are wgpu's, and glow has no equivalent —
# there is nothing to demote *to* under it.
#
# The review item 6 asks for, measured on this machine: wgpu costs 37 more crates (309 to
# 346) and 4.8 MB of binary (5.7 MB to 10.5 MB). It also runs the spike's frame slightly
# cheaper — 0.22 ms median against glow's 0.25, and 0.32 ms worst against 0.52 — so the
# cost is size, not speed. Against an Electron client that ships a browser, 10.5 MB for a
# renderer that can reach WARP is not a close call.
eframe = { version = "0.36.1", default-features = false, features = [
    "wgpu",
    "default_fonts",
] }
egui = "0.36.1"
serde_json.workspace = true

[target.'cfg(windows)'.dependencies]
# The virtual screen's rectangle, for deciding whether a saved window position is still on
# a monitor. Four calls, no other use.
windows-sys = { version = "0.61", features = ["Win32_UI_WindowsAndMessaging"] }

[lints]
workspace = true
