# Two mitigations that are off by default on stable, cost nothing, and are already in
# every Chromium this app ships today.
#
# Control Flow Guard checks indirect call targets against a compiler-built table. It is
# the one that matters here: this process parses attacker-reachable bytes -- RTP, Opus and
# another process's memory -- in the same address space as its own control flow.
[target.x86_64-pc-windows-msvc]
rustflags = ["-C", "control-flow-guard=yes", "-C", "link-arg=/CETCOMPAT"]
