name: Release

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ${{ matrix.os }}

    permissions:
      contents: write

    strategy:
      # Publishing one platform's artifacts is still worth doing when the other
      # platform's build breaks, so do not cancel the sibling job.
      fail-fast: false
      matrix:
        include:
         - os: windows-latest
           dist: 'publish'
           installer: 'dist/AnotherCrewLink Setup*.exe'
         - os: ubuntu-latest
           dist: 'publish:linux'
           installer: 'dist/AnotherCrewLink-*.AppImage'

    steps:
      - name: Check out Git repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24.x

      - name: Install Linux dependencies
        if: ${{ matrix.os == 'ubuntu-latest' }}
        run: |
          sudo apt-get update
          sudo apt-get install -y libxcb1-dev libx11-dev

      - name: Install Dependencies
        run: npm ci

      - name: Build App
        run: npm run ${{ matrix.dist }}
        env:
          # The workflow's own token already carries contents: write for this
          # repository, so publishing needs no separately configured secret.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Installer
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: AnotherCrewLink Installer ${{ runner.os }}
          path: ${{ matrix.installer }}
          if-no-files-found: error

      - name: Upload Unpacked 64bit
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: ${{ matrix.os == 'windows-latest' }}
        with:
          name: AnotherCrewLink Unpacked 64bit
          path: 'dist/win-unpacked'

      - name: Upload Unpacked 32bit
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: ${{ matrix.os == 'windows-latest' }}
        with:
          name: AnotherCrewLink Unpacked 32bit
          path: 'dist/win-ia32-unpacked'
