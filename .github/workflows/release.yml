name: Release

on:
  workflow_dispatch:

jobs:
  build:
    # Windows x64 is the only artefact. Linux went on 2026-08-25 for want of anybody who
    # could test it, and the 32-bit build went with the move to a Windows 11 floor --
    # there is no 32-bit edition of Windows 11 to install it on.
    runs-on: windows-latest

    permissions:
      contents: write

    steps:
      - name: Check out Git repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24.x

      # node-gyp fetches the Node headers through undici, which has crashed mid-parse
      # when the connection drops (assert(!this.paused) inside its response parser).
      # That is a transient network failure in someone else's HTTP client, so one retry
      # turns a failed release into a slow one.
      - name: Install Dependencies
        shell: bash
        run: npm ci || (echo "npm ci failed, retrying once" && npm ci)

      - name: Build App
        run: npm run publish
        env:
          # The workflow's own token already carries contents: write for this
          # repository, so publishing needs no separately configured secret.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Installer
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: AnotherCrewLink Installer Windows
          path: 'dist/AnotherCrewLink Setup*.exe'
          if-no-files-found: error

      - name: Upload Unpacked 64bit
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: AnotherCrewLink Unpacked 64bit
          path: 'dist/win-unpacked'
