name: Release

on:
  workflow_dispatch:

jobs:
  build:
    # Windows x64 is the only artefact. Linux went on 2026-08-25 for want of anybody who
    # could test it, and the 32-bit build went with the move to a Windows 11 floor --
    # there is no 32-bit edition of Windows 11 to install it on.
    runs-on: windows-latest

    permissions:
      contents: write
      # What the attestation needs. With no code signing, this is what answers "prove this
      # binary came from this commit" — and it answers it better than a certificate proves
      # who built it.
      id-token: write
      attestations: write

    steps:
      - name: Check out Git repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24.x

      # node-gyp fetches the Node headers through undici, which has crashed mid-parse
      # when the connection drops (assert(!this.paused) inside its response parser).
      # That is a transient network failure in someone else's HTTP client, so one retry
      # turns a failed release into a slow one.
      - name: Install Dependencies
        shell: bash
        run: npm ci || (echo "npm ci failed, retrying once" && npm ci)

      # `--publish never`, not `always`. electron-builder still writes `latest.yml` — the
      # update info file is produced whenever a publish provider is configured, and only
      # the upload is skipped — so the installer and the feed both exist here, and neither
      # reaches anybody until a person publishes the draft below. That distinction is the
      # whole point: uploading `latest.yml` is the act that moves every installed client.
      - name: Build App
        run: npm run dist:64 -- --publish never

      - name: Work out the version
        id: version
        shell: bash
        run: |
          version=$(node -p "require('./package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Releasing $version"

      # The tag and package.json have to agree, or the feed announces a version nobody can
      # find. Checked rather than trusted: the failure is silent until a client tries.
      - name: The tag matches package.json
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME#v}"
          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "$tag" != "${{ steps.version.outputs.version }}" ]; then
            echo "package.json says ${{ steps.version.outputs.version }}, the tag says $tag"
            exit 1
          fi

      # Both halves, before anything is drafted. A release with the installer and no
      # `latest.yml` looks finished and updates nobody; the fleet goes on being told it is
      # up to date, and that is discovered weeks later.
      - name: Both halves of the release exist
        shell: bash
        run: |
          version="${{ steps.version.outputs.version }}"
          test -f "dist/AnotherCrewLink-Setup-$version.exe" || {
            echo "::error::electron-builder produced no installer for $version"; exit 1; }
          test -f dist/latest.yml || {
            echo "::error::no dist/latest.yml. electron-builder writes it from the publish \
          block in electron-builder.yml; if that block went, the fleet gets no update."; exit 1; }
          cat dist/latest.yml

      - name: Attest the installer
        uses: actions/attest-build-provenance@bd77c077858b8d561b7a36cbe48ef4cc642ca39d # v2.2.2
        with:
          subject-path: dist/AnotherCrewLink-Setup-*.exe

      - name: Upload Installer
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: AnotherCrewLink Installer Windows
          path: |
            dist/AnotherCrewLink-Setup-*.exe
            dist/latest.yml
          if-no-files-found: error

      - name: Upload Unpacked 64bit
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: AnotherCrewLink Unpacked 64bit
          path: 'dist/win-unpacked'

      # Drafted, never published, and `latest.yml` is what makes that distinction matter.
      # Publishing a release containing it is the act that moves every installed client;
      # a workflow that did it automatically would be a fleet update that happened because
      # somebody clicked "Run workflow". So a person opens the draft and presses the button.
      # The notes come from CHANGELOG.md, at creation, and that is not tidiness.
      #
      # 1.0.6 was published by accident on 2026-08-27: the draft went up with a placeholder,
      # somebody ran `gh release edit --notes-file` to put the real notes in, and `gh release
      # edit` clears the draft flag as a side effect of editing. The release went live
      # mid-sentence, `latest.yml` with it, and immutable releases meant there was no taking
      # it back.
      #
      # The fix is not "remember to pass --draft to edit". It is to leave no edit step: the
      # notes a release needs are the ones in CHANGELOG.md, which is written before the
      # release rather than after it, so there is nothing to fill in later.
      - name: Draft the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          version="${{ steps.version.outputs.version }}"
          # Everything between this version's heading and the next one.
          awk -v v="## v$version" '$0 == v {f=1; next} /^## v/ {f=0} f' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then
            echo "::error::CHANGELOG.md has no entry for v$version. Write the notes before \
          cutting the release, not after -- after is where the accident lives."
            exit 1
          fi

          gh release create "v$version" \
            --draft \
            --target "$GITHUB_SHA" \
            --title "AnotherCrewLink $version" \
            --notes-file notes.md \
            "dist/AnotherCrewLink-Setup-$version.exe" \
            dist/latest.yml || \
          gh release upload "v$version" \
            "dist/AnotherCrewLink-Setup-$version.exe" \
            dist/latest.yml --clobber
