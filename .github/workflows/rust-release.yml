name: Rust release

# §4.9 items 1 and 5. Builds the 2.x client, its helper and its updater, packages the
# hand-built NSIS installer, and attaches both the archive and the installer to a release.
#
# **This does not publish into the 1.x feed.** That is P8's bridge, and it is a different
# act with a different blast radius: the installed fleet's `electron-updater` picks up
# whatever `latest.yml` names, so writing one from here would move every 1.x machine. There
# is no `latest.yml` in this workflow, deliberately, and §4.12 is where the one that moves
# the fleet gets written.
#
# Every action is pinned to a commit SHA, as the other four workflows are. A tag is a moving
# target and `@v4` is a promise somebody else can break.

concurrency:
  # Includes the workflow name, for the reason spelled out in codeql.yml: without it every
  # workflow on the same ref shares one group and they cancel each other.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

on:
  push:
    tags:
      # 2.x only. A `v1.0.6` tag belongs to the Electron client and its own release
      # workflow, and two workflows racing to attach files to one release is how a release
      # ends up with one of them.
      - 'v2.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build, without the leading v'
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
      # `github-attestations` from §4.9 item 1. With no code signing, this is what answers
      # "prove this binary came from this commit" — and it answers it better than a
      # certificate proves who built it.
      id-token: write
      attestations: write
    steps:
      - name: Check out Git repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install the pinned Rust toolchain
        run: rustup show active-toolchain

      - name: Work out the version
        id: version
        shell: bash
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            version="${{ inputs.version }}"
          else
            version="${GITHUB_REF_NAME#v}"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Building $version"

      # The tag and the manifest have to agree, or the client reports a version nobody
      # released and the updater compares against the wrong number. Checked here rather
      # than trusted, because the failure is silent for everybody except the one person
      # reading an issue about it later.
      - name: The tag matches the workspace version
        shell: bash
        run: |
          declared=$(grep -m1 '^version = ' Cargo.toml | cut -d'"' -f2)
          if [ "$declared" != "${{ steps.version.outputs.version }}" ]; then
            echo "Cargo.toml says $declared, the tag says ${{ steps.version.outputs.version }}"
            exit 1
          fi

      - name: Build
        run: cargo build --locked --release --bin anothercrewlink --bin acl-helper

      # A shipped binary carries its own dependency list, so `cargo audit bin` still works
      # against an artefact months after the tree that built it moved on. The `auditable`
      # job in rust.yml proves the same thing on every push; this is the release doing it.
      - name: Install cargo-auditable
        run: cargo install cargo-auditable --locked --version 0.7.0

      - name: Rebuild with the dependency list embedded
        run: cargo auditable build --locked --release --bin anothercrewlink --bin acl-helper

      - name: The third-party attribution
        run: |
          cargo install cargo-about --locked --version 0.8.4
          cargo about generate about.hbs -o THIRD-PARTY.html

      # Not in the Rust toolchain and not on the runner: one step, for one file that
      # changes twice a year.
      - name: Install NSIS
        run: choco install nsis --no-progress --yes

      - name: Build the installer
        shell: bash
        run: |
          # The full path, because choco does not put NSIS on PATH within the same job.
          # `rust.yml` and `release.yml` both learned this; this one did not, and found out
          # at the first tag -- which is the moment a release workflow is least useful.
          makensis="/c/Program Files (x86)/NSIS/makensis.exe"
          "$makensis" -DVERSION=${{ steps.version.outputs.version }} \
                      -DSOURCE_DIR=../target/release \
                      installer/anothercrewlink.nsi
          ls -l installer/*.exe

      # What it produced, installed and taken away again before anybody is offered it. The
      # 2.x installer has never met a machine with a profile on it, and this is not that --
      # but it is the difference between shipping something that compiled and shipping
      # something that ran.
      #
      # `//S` and not `/S`: Git Bash rewrites an argument that looks like a POSIX path
      # before the program sees it, and the installer would not be silent.
      - name: It installs and uninstalls silently
        shell: bash
        run: |
          set +e
          ./installer/AnotherCrewLink-Setup-${{ steps.version.outputs.version }}.exe \
            --updated //S /D=$(cygpath -w "$PWD/proof") </dev/null >install.log 2>&1 &
          installer=$!
          for _ in $(seq 60); do kill -0 $installer 2>/dev/null || break; sleep 1; done
          if kill -0 $installer 2>/dev/null; then
            kill -9 $installer 2>/dev/null; wait $installer 2>/dev/null
            echo "::error::the installer did not exit under /S"
            exit 1
          fi
          wait $installer
          set -e
          test -f proof/anothercrewlink.exe
          test -f proof/acl-helper.exe
          # The locales are what the window reads at startup; without them every string is
          # its own key.
          test -s proof/static/locales/en/translation.json
          ./proof/Uninstall.exe //S _?=$(cygpath -w "$PWD/proof") </dev/null >/dev/null 2>&1
          for _ in $(seq 30); do [ -f proof/anothercrewlink.exe ] || break; sleep 1; done
          test ! -f proof/anothercrewlink.exe
          test ! -d proof/static

      - name: Attest the artefacts
        uses: actions/attest-build-provenance@bd77c077858b8d561b7a36cbe48ef4cc642ca39d # v2.2.2
        with:
          subject-path: |
            target/release/anothercrewlink.exe
            target/release/acl-helper.exe
            installer/AnotherCrewLink-Setup-${{ steps.version.outputs.version }}.exe

      - name: Upload the installer
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: AnotherCrewLink-Setup-${{ steps.version.outputs.version }}
          path: installer/AnotherCrewLink-Setup-${{ steps.version.outputs.version }}.exe
          if-no-files-found: error

      - name: Upload the unpacked build
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: AnotherCrewLink-${{ steps.version.outputs.version }}-x64
          path: |
            target/release/anothercrewlink.exe
            target/release/acl-helper.exe
            THIRD-PARTY.html
          if-no-files-found: error

      # Draft, always. A release that publishes itself is a release nobody looked at, and
      # §4.9's own instruction for this script is to prove it by shipping an ordinary
      # release with it first.
      # From CHANGELOG.md, at creation, for the reason `release.yml` carries: a draft with
      # placeholder notes is a draft somebody edits afterwards, and `gh release edit` clears
      # the draft flag as a side effect. That published 1.0.6 mid-sentence on 2026-08-27.
      - name: The notes for this version
        if: startsWith(github.ref, 'refs/tags/v2.')
        shell: bash
        run: |
          version="${{ steps.version.outputs.version }}"
          awk -v v="## v$version" '$0 == v {f=1; next} /^## v/ {f=0} f' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then
            echo "::error::CHANGELOG.md has no entry for v$version. Write the notes before           cutting the release, not after."
            exit 1
          fi
          cat notes.md

      - name: Draft the release
        if: startsWith(github.ref, 'refs/tags/v2.')
        uses: softprops/action-gh-release@72f2c25fcb47643c292f7107632f7a47c1df5cd8 # v2.3.2
        with:
          draft: true
          body_path: notes.md
          files: |
            installer/AnotherCrewLink-Setup-${{ steps.version.outputs.version }}.exe
            THIRD-PARTY.html
