name: WinGet

# Submits the Windows installer from a published release to the Windows Package Manager,
# so that `winget install greluc.AnotherCrewLink` fetches it and checks the hash itself
# instead of a user downloading an unsigned .exe through a browser and comparing a
# checksum by hand. It does nothing about the SmartScreen warning — that is a signing
# question, and README.md says where that stands.
#
# This packages the Electron client, which is what ships. The Rust port is not in scope:
# when it ships it gets its own identifier rather than replacing this one underneath
# people who already have the package installed.
#
# **The first version of a new identifier cannot be submitted from here.** komac refuses
# an identifier with no version in winget-pkgs, and the first submission is a manual pull
# request against a Microsoft repository. docs/winget.md has the steps; they have to be
# done once, by hand, before this workflow can succeed.

on:
  release:
    # `released`, not `published`. electron-builder uploads a draft, and a draft becoming
    # a real release fires `released` and not `published` — so `published` would miss the
    # only event that matters here while still firing for prereleases, which should not
    # reach winget.
    types: [released]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to submit, e.g. v1.0.5
        required: true

# Reading the release is all the workflow token is used for. The pull request against
# winget-pkgs is opened with WINGET_TOKEN, which is a different credential entirely.
permissions:
  contents: read

jobs:
  publish:
    # The artefact is a Windows installer and komac parses it to fill the manifest in:
    # installer type, product code, the Apps and Features entry. Doing that on the
    # platform it targets takes one variable out of a step whose output is reviewed by
    # someone else's CI and cannot be quietly corrected afterwards.
    runs-on: windows-latest

    steps:
      # Without this the run gets as far as downloading a 200 MB installer and then fails
      # on a 401 from inside komac. Name the missing secret instead.
      - name: Check the token is configured
        shell: pwsh
        env:
          WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:WINGET_TOKEN)) {
            Write-Output "::error::WINGET_TOKEN is not set. It is a classic PAT with the public_repo scope: komac needs it to push to this account's fork of winget-pkgs and open a pull request there, which the workflow token cannot do because it is scoped to this repository. See docs/winget.md."
            exit 1
          }

      - name: Resolve the release
        id: release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.event.release.tag_name }}
        run: |
          $ErrorActionPreference = 'Stop'
          $assets = gh api "repos/$env:GITHUB_REPOSITORY/releases/tags/$env:TAG" --jq '.assets[].browser_download_url'
          # The blockmap sits beside the installer as `...exe.blockmap` and exists for
          # delta updates, not for installing; anchoring on `.exe$` leaves it out, as it
          # leaves out the AppImage and the two update manifests.
          $urls = @($assets | Where-Object { $_ -match 'AnotherCrewLink-Setup-.*\.exe$' })
          if ($urls.Count -ne 1) {
            Write-Output "::error::expected exactly one Windows installer on $env:TAG, found $($urls.Count). Assets were: $($assets -join ', ')"
            exit 1
          }
          # winget versions carry no leading v; the tag does.
          $version = $env:TAG -replace '^v', ''
          Write-Output "version=$version" >> $env:GITHUB_OUTPUT
          Write-Output "url=$($urls[0])" >> $env:GITHUB_OUTPUT
          Write-Output "Submitting $version from $($urls[0])"

      # Pinned for the reason cargo-deny and cargo-vet are pinned in rust.yml: the
      # manifest schema and komac's own defaults move between releases, and this one
      # writes into a repository we do not control and cannot amend after the fact. A
      # crates.io version is immutable, so `--locked --version` pins the whole tree.
      #
      # The published action, vedantmgoyal9/winget-releaser, wraps exactly this komac
      # call — but it reaches cargo-bins/cargo-binstall@main and then installs komac
      # unpinned, so pinning the action to a commit would pin nothing that runs.
      - name: Install komac
        run: cargo install komac --locked --version 2.16.0

      - name: Submit to winget-pkgs
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.WINGET_TOKEN }}
          KOMAC_FORK_OWNER: ${{ github.repository_owner }}
          KOMAC_CREATED_WITH: AnotherCrewLink release
          KOMAC_CREATED_WITH_URL: ${{ github.server_url }}/${{ github.repository }}
        run: |
          komac update greluc.AnotherCrewLink `
            --version '${{ steps.release.outputs.version }}' `
            --urls '${{ steps.release.outputs.url }}' `
            --submit

      # Merged submissions leave their branch behind on the fork, and the fork is a
      # personal one rather than a throwaway. Nothing here touches an open branch.
      - name: Clean up merged branches on the fork
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.WINGET_TOKEN }}
          KOMAC_FORK_OWNER: ${{ github.repository_owner }}
        run: komac cleanup --only-merged
