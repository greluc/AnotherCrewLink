name: Rust

concurrency:
  # Includes the workflow name, for the reason spelled out in codeql.yml: without it every
  # workflow on the same ref shares one group and they cancel each other.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: ['**']
    # The Electron client is what ships today and has its own workflow. A push that
    # touches only it must not spend minutes compiling Rust, and build.yml carries the
    # mirror image of this filter so the reverse holds too.
    paths:
      - 'crates/**'
      - 'experiments/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'deny.toml'
      - 'rust-toolchain.toml'
      - '.cargo/**'
      - '.github/workflows/rust.yml'
      # The installer job below compiles this and then runs what it produced. Without it
      # here, an edit to the script is checked at release time, which is the one moment
      # when discovering it is most expensive.
      - 'installer/**'
      # Gate G1 replays these against the Rust reader. Without them here, adding a
      # recording the reader disagrees with leaves the repository green until somebody
      # happens to touch a crate.
      - 'test/recordings/**'
      # The source `collider_data.rs` is generated from. The drift check below only
      # protected the direction that was already safe: it fired when the generated file
      # changed, and not when the file it is generated from did. So a collider edited in
      # the Electron client left the Rust reader holding the old walls, green, until
      # somebody happened to touch a crate — and a wrong collider does not error, it
      # silently reports that no wall is ever in the way.
      - 'src/common/ColliderMap.ts'
  pull_request:
    paths:
      - 'crates/**'
      - 'experiments/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'deny.toml'
      - 'rust-toolchain.toml'
      - '.cargo/**'
      - '.github/workflows/rust.yml'
      # The installer job below compiles this and then runs what it produced. Without it
      # here, an edit to the script is checked at release time, which is the one moment
      # when discovering it is most expensive.
      - 'installer/**'
      # Gate G1 replays these against the Rust reader. Without them here, adding a
      # recording the reader disagrees with leaves the repository green until somebody
      # happens to touch a crate.
      - 'test/recordings/**'
      # The source `collider_data.rs` is generated from. The drift check below only
      # protected the direction that was already safe: it fired when the generated file
      # changed, and not when the file it is generated from did. So a collider edited in
      # the Electron client left the Rust reader holding the old walls, green, until
      # somebody happened to touch a crate — and a wrong collider does not error, it
      # silently reports that no wall is ever in the way.
      - 'src/common/ColliderMap.ts'
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Nothing here is reused between runs, so incremental artefacts are written and thrown
  # away.
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: 1

jobs:
  check:
    # Format and lint once. They are target-independent, and running them three times
    # would only make the same complaint three times.
    runs-on: windows-latest
    steps:
      - name: Check out Git repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # rust-toolchain.toml pins 1.98.0 and names rustfmt, clippy and all three targets,
      # so rustup installs exactly that on the first cargo invocation. Doing it in a step
      # of its own means a toolchain problem reports itself as a toolchain problem.
      - name: Install the pinned Rust toolchain
        run: |
          rustup show active-toolchain
          rustc --version

      # cargo fmt resolves no dependencies and takes no --locked; every command below that
      # does resolve them has it.
      - name: Check formatting
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings

      # The collider tables are generated. If regenerating them changes the committed
      # file, the two have drifted and the walls in the Rust client are not the walls in
      # the Electron one.
      - name: The generated collider tables match their source
        run: |
          node scripts/port-collider-data.mjs
          git diff --exit-code crates/acl-types/src/collider_data.rs

  test:
    # One target since 2026-08-25. There was an `x86_64-unknown-linux-gnu` leg with an apt
    # step for GTK, xkbcommon, Wayland and ALSA; it went with the client's Linux support,
    # and so did the `fail-fast: false` that kept one leg from hiding the other.
    runs-on: windows-latest
    steps:
      - name: Check out Git repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install the pinned Rust toolchain
        run: rustup show active-toolchain

      - name: Build
        run: cargo build --locked --workspace --all-targets --target x86_64-pc-windows-msvc

      # The conformance test drives this client against the Rust server, which is itself
      # verified against the reference socket.io-client from Node. Checking out a second
      # repository to run it is the price of testing against an implementation that did
      # not come from this one.
      - name: Check out the server
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: greluc/AnotherCrewLink-Server
          path: server

      - name: Build the server
        working-directory: server
        run: cargo build --locked

      - name: Test
        env:
          ACL_SERVER_BIN: server/target/debug/acl-server.exe
        run: cargo test --locked --workspace --target x86_64-pc-windows-msvc

  installer:
    # The installer script, compiled and then *run*.
    #
    # It used to be built only by the release job, on a tag. So a script that did not
    # compile stayed green until somebody cut a release, and `tests/installer_contract.rs`
    # -- which reads the .nsi as text -- could only ever check that the right words were
    # in it. Words being in a file is not the same as NSIS accepting them.
    #
    # The binaries are stubs. What is under test is the script: its sections, its macros,
    # the whole MUI setup, the registry writes, and the uninstaller it generates. None of
    # that depends on what is inside the executables it copies, and building the real ones
    # here would add ten minutes to every push to check nothing extra.
    runs-on: windows-latest
    steps:
      - name: Check out Git repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install NSIS
        run: choco install nsis --no-progress --yes

      - name: Stand in for the built binaries
        shell: bash
        run: |
          mkdir -p stubs
          for name in anothercrewlink acl-helper acl-updater; do
            printf 'stub' > "stubs/$name.exe"
          done

      # The version carries a prerelease suffix on purpose. `VIProductVersion` takes four
      # numbers and aborts on anything else, the release workflow triggers on `v2.*` --
      # which matches `v2.0.0-rc.1` -- and §4.12's staged rollout is exactly what would be
      # tagged that way. Compiling only `0.0.0` here would leave that path to be discovered
      # by the first staging release, on the day it mattered.
      - name: Compile the installer
        shell: bash
        run: |
          # NSIS is not on PATH after a choco install in the same job.
          makensis="/c/Program Files (x86)/NSIS/makensis.exe"
          "$makensis" -DVERSION=0.0.0-ci -DSOURCE_DIR=../stubs installer/anothercrewlink.nsi
          test -s installer/AnotherCrewLink-Setup-0.0.0-ci.exe
          # The bridge is the script the installed fleet actually runs, so it is the one
          # whose failure would be discovered by everybody at once.
          "$makensis" -DVERSION=1.1.0 -DSOURCE_DIR=../stubs installer/bridge.nsi

      # The silent switches are a contract with 1.x's updater, which spawns
      # `installer.exe --updated /S /D=<dir>` and never sees a window. A script that
      # compiles but shows a dialog under /S hangs that updater forever, and no amount of
      # reading the source says whether it does.
      - name: Install it silently, the way the updater will
        shell: bash
        run: |
          # Bounded, and the bound is the assertion. 1.x's updater spawns this and waits on
          # the process; an installer that does not exit hangs that updater forever, on
          # every machine, at once. Two minutes is far longer than a copy of a few files
          # needs, so exceeding it is the bug rather than a slow runner.
          #
          # stdin from /dev/null and output to a file: bash on Windows waits on handles the
          # child inherited, so a process that has exited can still look like one that has
          # not, and that would read as the hang above.
          set +e
          timeout 120 ./installer/AnotherCrewLink-Setup-0.0.0-ci.exe --updated /S \
            /D=$(cygpath -w "$PWD/installed") </dev/null >install.log 2>&1
          code=$?
          set -e
          cat install.log || true
          if [ $code -eq 124 ]; then
            echo "::error::the installer did not exit within 120s under /S"
            exit 1
          fi
          echo "installer exit code: $code"
          # NSIS can return before the last handle is closed, so give the files a moment.
          for _ in $(seq 20); do
            [ -f installed/anothercrewlink.exe ] && break
            sleep 1
          done
          test -f installed/anothercrewlink.exe
          test -f installed/acl-helper.exe
          test -f installed/Uninstall.exe
          # The locales are what the app reads at startup; an installer that forgot them
          # is one that starts and shows nothing but keys.
          test -d installed/static/locales
          test -s installed/static/locales/en/translation.json

      - name: And take it away again
        shell: bash
        run: |
          # Bounded for the same reason, and `_?=` for a different one: it tells NSIS to run
          # the uninstaller in place rather than from a copy in the temp directory, which is
          # the only way a script can wait for it and see the result.
          set +e
          timeout 120 ./installed/Uninstall.exe /S _?=$(cygpath -w "$PWD/installed") \
            </dev/null >uninstall.log 2>&1
          code=$?
          set -e
          cat uninstall.log || true
          if [ $code -eq 124 ]; then
            echo "::error::the uninstaller did not exit within 120s under /S"
            exit 1
          fi
          echo "uninstaller exit code: $code"
          for _ in $(seq 20); do
            [ -f installed/anothercrewlink.exe ] || break
            sleep 1
          done
          # `_?=` keeps Uninstall.exe itself, which is how NSIS runs an uninstaller
          # in-place rather than from a copy in the temp directory. Everything it was
          # responsible for should be gone.
          test ! -f installed/anothercrewlink.exe
          test ! -d installed/static

  deny:
    # Advisories, licences, duplicate versions and crate sources — the policy is in
    # deny.toml. Split out so a supply-chain failure is legible at a glance and does not
    # hide behind a compile error.
    runs-on: ubuntu-latest
    steps:
      - name: Check out Git repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install the pinned Rust toolchain
        run: rustup show active-toolchain

      # Pinned to the version this policy was written and verified against. cargo-deny
      # reads deny.toml and its schema moves between releases, so an unpinned install
      # would let an upstream release turn a green gate red with nothing changed here.
      - name: Install cargo-deny
        run: cargo install cargo-deny --locked --version 0.20.2

      - name: Check dependencies
        run: cargo deny --locked check

      # Pinned for the same reason cargo-deny is: the store format moves between
      # releases, and an unpinned install turns a green gate red with nothing changed
      # here.
      - name: Install cargo-vet
        run: cargo install cargo-vet --locked --version 0.10.2

      # This passes on exemptions rather than audits — 38 of 283 crates are covered, and
      # supply-chain/README.md says so in as many words. What it catches is a *new*
      # unaudited dependency arriving unnoticed.
      - name: Check the audit store
        run: cargo vet --locked

  attribution:
    # Distributing a GPL binary means distributing the licence texts of everything linked
    # into it. The file is generated rather than committed, so this checks that it can
    # still be generated — a dependency with an unrecognised licence fails here rather
    # than at release time.
    runs-on: ubuntu-latest
    steps:
      - name: Check out Git repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install the pinned Rust toolchain
        run: rustup show active-toolchain

      - name: Install cargo-about
        run: cargo install cargo-about --locked --version 0.9.2 --features cli

      - name: Generate the third-party attribution
        run: cargo about generate about.hbs -o THIRD-PARTY.html

      - name: It is not empty
        run: |
          test -s THIRD-PARTY.html
          grep -q '<h2>' THIRD-PARTY.html

  auditable:
    # A shipped binary carries its own dependency list, so `cargo audit bin` still works
    # against an artefact months after the tree that built it moved on. Proving that here
    # means the release build in P7 inherits a mechanism that is known to work rather than
    # one that was written down.
    #
    # On Windows, unlike the two jobs above it: this one compiles a binary rather than
    # reading metadata, and since 2026-08-25 that is the only target anything ships for.
    # `deny` and `attribution` stay on Linux runners -- they resolve a dependency graph,
    # and about.toml names the target it describes.
    runs-on: windows-latest
    steps:
      - name: Check out Git repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install the pinned Rust toolchain
        run: rustup show active-toolchain

      - name: Install cargo-auditable and cargo-audit
        run: cargo install cargo-auditable cargo-audit --locked

      - name: Build with an embedded dependency list
        run: cargo auditable build --locked --release -p apm-probe

      - name: The list is actually in the binary
        run: cargo audit bin target/release/apm-probe.exe
