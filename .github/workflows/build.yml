name: Build

concurrency:
  # Includes the workflow name: without it Build and CodeQL share one group
  # on the same ref and cancel each other on every push.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    # One platform, so no matrix. Linux was dropped on 2026-08-25 -- there was nobody who
    # could test an AppImage, and a green CI leg for a platform nobody runs says the
    # product works there when all it says is that it compiles.
    runs-on: windows-latest

    permissions:
      contents: read

    steps:
      - name: Check out Git repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24.x

      - name: Cache Node Modules
        id: node-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            node_modules
          key: ${{ runner.os }}-3-${{ hashFiles('package-lock.json')}}

      # node-gyp fetches the Node headers through undici, which has crashed mid-parse
      # when the connection drops (assert(!this.paused) inside its response parser).
      # That is a transient network failure in someone else's HTTP client, so one retry
      # turns a failed release into a slow one.
      - name: Install Dependencies
        if: steps.node-cache.outputs.cache-hit != 'true'
        shell: bash
        run: npm ci || (echo "npm ci failed, retrying once" && npm ci)

      # Fails the build if a dependency picks up a high or critical advisory, so
      # this does not have to be noticed by hand later.
      - name: Audit Dependencies
        run: npm audit --audit-level=high

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      # The arguments need the -- separator: npm passes anything after the script
      # name straight through to the script, so "npm run dist --publish never"
      # appended a bare "never" to the electron-builder command line.
      - name: Build App
        run: npm run dist:64 -- --publish never

      - name: Upload Installer
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: AnotherCrewLink Installer Windows
          path: 'dist/AnotherCrewLink-Setup-*.exe'
          if-no-files-found: error

      - name: Upload Unpacked
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: AnotherCrewLink Unpacked 64bit
          path: 'dist/win-unpacked'
