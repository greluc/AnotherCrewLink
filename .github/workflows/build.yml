name: Build

concurrency:
  # Includes the workflow name: without it Build and CodeQL share one group
  # on the same ref and cancel each other on every push.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    # The Rust workspace has its own workflow. A push that touches only it changes nothing
    # this job builds, lints or tests, so skip it rather than rerunning the Electron build
    # and both installers for it. rust.yml carries the mirror image of this filter.
    # Everything else — src/, static/, package.json — still triggers a run, because
    # paths-ignore only skips when every changed path matches.
    paths-ignore:
      - 'crates/**'
      - 'experiments/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'deny.toml'
      - 'rust-toolchain.toml'
      - '.cargo/**'
      - '.github/workflows/rust.yml'
      - 'test/recordings/**'
  pull_request:
    paths-ignore:
      - 'crates/**'
      - 'experiments/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'deny.toml'
      - 'rust-toolchain.toml'
      - '.cargo/**'
      - '.github/workflows/rust.yml'
      - 'test/recordings/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ${{ matrix.os }}

    permissions:
      contents: read

    strategy:
      # Without this a failure on one platform cancels the other job before it
      # finishes, so a single broken build hides the state of the second one.
      fail-fast: false
      matrix:
        include:
         - os: windows-latest
           dist: 'dist'
           installer: 'dist/AnotherCrewLink Setup*.exe'
         - os: ubuntu-latest
           dist: 'dist:linux'
           installer: 'dist/AnotherCrewLink-*.AppImage'

    steps:
      - name: Install Linux dependencies
        if: ${{ matrix.os == 'ubuntu-latest' }}
        run: |
          sudo apt-get update
          # libXtst, libXrandr and libXt are libuiohook's: it records input through the
          # XRecord extension, which the old key watcher did not use.
          sudo apt-get install -y libxcb1-dev libx11-dev libxtst-dev libxrandr-dev libxt-dev

      - name: Check out Git repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24.x

      - name: Cache Node Modules
        id: node-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            node_modules
          key: ${{ runner.os }}-3-${{ hashFiles('package-lock.json')}}

      # node-gyp fetches the Node headers through undici, which has crashed mid-parse
      # when the connection drops (assert(!this.paused) inside its response parser).
      # That is a transient network failure in someone else's HTTP client, so one retry
      # turns a failed release into a slow one.
      - name: Install Dependencies
        if: steps.node-cache.outputs.cache-hit != 'true'
        shell: bash
        run: npm ci || (echo "npm ci failed, retrying once" && npm ci)

      # Fails the build if a dependency picks up a high or critical advisory, so
      # this does not have to be noticed by hand later.
      - name: Audit Dependencies
        run: npm audit --audit-level=high

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      # The arguments need the -- separator: npm passes anything after the script
      # name straight through to the script, so "npm run dist --publish never"
      # appended a bare "never" to the electron-builder command line.
      - name: Build App
        run: npm run ${{ matrix.dist }} -- --publish never

      - name: Upload Installer
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: AnotherCrewLink Installer ${{ runner.os }}
          path: ${{ matrix.installer }}
          if-no-files-found: error

      - name: Upload Unpacked
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: ${{ matrix.os == 'windows-latest'}}
        with:
          name: AnotherCrewLink Unpacked 64bit
          path: 'dist/win-unpacked'
