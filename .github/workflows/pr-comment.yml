name: Comment on pull request

on:
  # Only runs once the build workflow finished, because it links to the artifacts
  # that workflow publishes.
  workflow_run:
    workflows: ['Build']
    types: [completed]

jobs:
  pr_comment:
    name: Add packages to PRs
    if: github.event.workflow_run.event == 'pull_request' && github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest

    permissions:
      actions: read
      pull-requests: write

    steps:
      - name: Comment on PR
        uses: actions/github-script@373c709c69115d41ff229c7e5df9f8788daa9553 # v9
        with:
          script: |
            const { owner, repo } = context.repo;
            const run = context.payload.workflow_run;

            // Resolve the PR through the authenticated API rather than the public
            // issue search, which is rate limited per runner IP and often empty for
            // a freshly pushed commit.
            const { data: pulls } = await github.rest.repos.listPullRequestsAssociatedWithCommit({
              owner,
              repo,
              commit_sha: run.head_sha,
            });
            const pr = pulls.find((candidate) => candidate.state === 'open') ?? pulls[0];
            if (!pr) {
              return core.info(`No pull request is associated with ${run.head_sha}, nothing to comment on.`);
            }

            const artifacts = await github.paginate(github.rest.actions.listWorkflowRunArtifacts, {
              owner,
              repo,
              run_id: run.id,
            });
            if (!artifacts.length) {
              return core.warning('The build produced no artifacts.');
            }

            const marker = '<!-- bot: nightly-link -->';
            const lines = artifacts.map(
              (artifact) => `* [${artifact.name}.zip](https://nightly.link/${owner}/${repo}/actions/artifacts/${artifact.id}.zip)`
            );
            const body = [
              marker,
              'Download the artifacts for this pull request:',
              '',
              ...lines,
              '',
              '<hr />',
              '',
              'Provided by [nightly.link](https://github.com/oprypin/nightly.link). These artifacts expire after 90 days.',
            ].join('\n');

            const { data: comments } = await github.rest.issues.listComments({
              owner,
              repo,
              issue_number: pr.number,
            });
            const existing = comments.filter((comment) => comment.body?.includes(marker)).pop();
            if (existing) {
              core.info(`Updating comment ${existing.id}`);
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              core.info(`Creating a comment on pull request ${pr.number}`);
              await github.rest.issues.createComment({ owner, repo, issue_number: pr.number, body });
            }

# Originally adapted from the public-domain snippet at
# https://github.com/oprypin/nightly.link/blob/master/.github/workflows/pr-comment.yml
