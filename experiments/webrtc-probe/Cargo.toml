[package]
name = "webrtc-probe"
description = "P4+ experiment 3: does the pinned webrtc crate connect two peers, trickle both ways and carry a message?"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
# Pinned exactly, as §4.6 item 2 asks: the maintainer states a minor bump may carry
# breaking changes, and 0.20 is a sans-IO rewrite rather than the Pion port older
# versions were. This is the version the phase is planned against, so it is the version
# the spike answers for.
webrtc = "=0.20.3"
# The event handler trait is declared with `#[async_trait]`, so an implementation needs
# the same macro. Not a choice this probe makes.
async-trait = "0.1"
tokio = { version = "1.53", features = ["rt-multi-thread", "macros", "sync", "time"] }
