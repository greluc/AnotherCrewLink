[package]
name = "gui-spike"
description = "P6 item 1: can egui carry this client's two hardest screens, and at what frame cost?"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
# The models, not a copy of them. The spike exists to find out whether the views can be
# built on what P1+ produced, and reimplementing the ordering here would answer a question
# nobody asked.
acl-ui = { path = "../../crates/acl-ui", version = "0.0.0" }
# Defaults off, then back on by name, as `overlay-probe` does. `glow` because the overlay
# probe used it and the two results should be comparable; the wgpu rung of §4.8's fallback
# chain is a separate question and a separate measurement.
eframe = { version = "0.36.1", default-features = false, features = [
    "glow",
    "default_fonts",
] }
egui = "0.36.1"

# The workspace lints are for shipped code. This is a probe: it draws, measures and exits.
