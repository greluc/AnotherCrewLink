<!doctype html>
<meta charset="utf-8" />
<title>our fec, chromium's receiver</title>
<!-- Nothing renders. A peer connection and an encoded transform both need a document, and
     the transform APIs are gated on a secure context, which `about:blank` is not. -->
<script>
	const FRAME_MS = 20;
	const SAMPLE_RATE = 48000;
	const SEED = 20260824;

	/** The same xorshift `acl-audio::impairment` carries, for the same drop decisions. */
	function xorshift(seed) {
		let state = seed >>> 0 || 0x1234_5678;
		return {
			next() {
				state ^= (state << 13) >>> 0;
				state >>>= 0;
				state ^= state >>> 17;
				state ^= (state << 5) >>> 0;
				state >>>= 0;
				return state;
			},
			rolls(percent) {
				if (percent === 0) return false;
				return this.next() % 100 < percent;
			},
		};
	}

	function dropList(lossPercent, count) {
		const random = xorshift(SEED);
		const dropped = new Set();
		for (let index = 0; index < count; index += 1) {
			if (random.rolls(lossPercent)) dropped.add(index);
		}
		return dropped;
	}

	/**
	 * Runs one stream of our packets through Chromium's receive path, losing some of them.
	 *
	 * Two transforms, doing different jobs:
	 *
	 * - On the **sender**, every encoded frame's payload is replaced with one of ours. What
	 *   Chromium packetises and sends is then this client's Opus, not its own — which is
	 *   the only way to put our redundancy in front of its decoder without a transport.
	 * - On the **receiver**, some frames are dropped after depacketisation and before
	 *   NetEQ. That is where Chromium notices a gap and, if the packet after it carries a
	 *   redundant copy, recovers from it.
	 *
	 * Dropping on the receiving side rather than the sending side matters. Dropped before
	 * packetisation, the sequence numbers close up and nothing downstream ever knows a
	 * frame is missing.
	 */
	async function run(packets, lossPercent, seconds) {
		const toDrop = dropList(lossPercent, packets.length);

		const context = new AudioContext({ sampleRate: SAMPLE_RATE });
		const oscillator = context.createOscillator();
		oscillator.frequency.value = 300;
		const destination = context.createMediaStreamDestination();
		oscillator.connect(destination);
		oscillator.start();

		const sender = new RTCPeerConnection();
		const receiver = new RTCPeerConnection();
		sender.onicecandidate = (e) => e.candidate && receiver.addIceCandidate(e.candidate);
		receiver.onicecandidate = (e) => e.candidate && sender.addIceCandidate(e.candidate);

		let sink = null;
		let receiverTransformInstalled = false;
		let droppedCount = 0;
		receiver.ontrack = (event) => {
			// The receive path only runs if something consumes the track. Volume zero
			// rather than muted: muting is allowed to stop the decode, and the decode is
			// what is being measured.
			sink = document.createElement('audio');
			sink.autoplay = true;
			sink.volume = 0;
			sink.srcObject = event.streams[0];
			document.body.appendChild(sink);
			sink.play().catch(() => {});

			const rtpReceiver = event.receiver;
			const streams = rtpReceiver.createEncodedStreams();
			let seen = 0;
			streams.readable
				.pipeThrough(
					new TransformStream({
						transform(frame, controller) {
							const index = seen;
							seen += 1;
							if (toDrop.has(index)) {
								droppedCount += 1;
								return;
							}
							controller.enqueue(frame);
						},
					})
				)
				.pipeTo(streams.writable);
			receiverTransformInstalled = true;
		};

		const [track] = destination.stream.getAudioTracks();
		const rtpSender = sender.addTrack(track, destination.stream);

		let substituted = 0;
		const outgoing = rtpSender.createEncodedStreams();
		outgoing.readable
			.pipeThrough(
				new TransformStream({
					transform(frame, controller) {
						const packet = packets[substituted % packets.length];
						substituted += 1;
						// Chromium's own encoded audio, replaced with ours. Same codec,
						// same rate, same frame duration, so everything downstream of here
						// is unchanged except the bytes.
						frame.data = new Uint8Array(packet).buffer;
						controller.enqueue(frame);
					},
				})
			)
			.pipeTo(outgoing.writable);

		await sender.setLocalDescription(await sender.createOffer());
		await receiver.setRemoteDescription(sender.localDescription);
		await receiver.setLocalDescription(await receiver.createAnswer());
		await sender.setRemoteDescription(receiver.localDescription);

		await new Promise((resolve) => setTimeout(resolve, seconds * 1000));

		let inbound = null;
		(await receiver.getStats()).forEach((report) => {
			if (report.type === 'inbound-rtp' && report.kind === 'audio') inbound = report;
		});

		oscillator.stop();
		if (sink) {
			sink.srcObject = null;
			sink.remove();
		}
		await context.close();
		sender.close();
		receiver.close();

		if (!inbound) return { error: 'no inbound-rtp report' };
		const total = inbound.totalSamplesReceived || 0;
		return {
			substituted,
			droppedCount,
			receiverTransformInstalled,
			totalSamplesReceived: total,
			concealedSamples: inbound.concealedSamples || 0,
			concealedShare: total > 0 ? ((inbound.concealedSamples || 0) / total) * 100 : 0,
			packetsReceived: inbound.packetsReceived || 0,
		};
	}

	window.compare = async (withFec, withoutFec, lossPercent, seconds) => {
		try {
			const protectedRun = await run(withFec, lossPercent, seconds);
			const bareRun = await run(withoutFec, lossPercent, seconds);
			return { protectedRun, bareRun };
		} catch (error) {
			return { error: String((error && error.stack) || error) };
		}
	};
</script>
